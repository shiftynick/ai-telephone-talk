<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Mascot preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #efe8da; overflow: hidden; font: 14px/1.4 ui-monospace, monospace; }
  #ui { position: fixed; left: 12px; top: 10px; display: flex; gap: 6px; }
  button { font: inherit; padding: 6px 10px; border: 1px solid #333; background: #fff; cursor: pointer; }
  button.on { background: #222; color: #fff; }
</style>
<script type="importmap">{ "imports": { "three": "../vendor/three/three.module.js", "three/addons/": "../vendor/three/addons/" } }</script>
</head>
<body>
<div id="ui"></div>
<script type="module">
  import * as THREE from 'three';
  import { createMascot } from './mascot.js';

  const q = new URLSearchParams(location.search);
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(devicePixelRatio);
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xefe8da);
  const cam = new THREE.PerspectiveCamera(26, innerWidth / innerHeight, 0.1, 100);
  scene.add(new THREE.HemisphereLight(0xfff4e6, 0x8a7a70, 1.6));
  const sun = new THREE.DirectionalLight(0xffffff, 2.4);
  sun.position.set(3, 6, 4);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3 });
  scene.add(sun);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({ opacity: 0.25 }));
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);

  // a lineup: one mascot per view angle (?grid=1), or a single turntable
  const grid = q.has('grid');
  const views = grid ? [0, -Math.PI / 2, Math.PI, Math.PI / 2, -Math.PI / 4, -3 * Math.PI / 4, 3 * Math.PI / 4, Math.PI / 4] : [0];
  const ms = views.map((ry, n) => {
    const m = createMascot(THREE);
    m.root.rotation.y = ry;
    if (grid) m.root.position.set((n % 4 - 1.5) * 1.3, 0, n < 4 ? -0.8 : 0.8);
    scene.add(m.root);
    return m;
  });
  const clip = q.get('clip') || 'idle';
  ms.forEach((m) => m.play(clip));

  if (grid) { cam.position.set(0, 3.2, 10); cam.lookAt(0, 0.35, 0); }
  else { const a = +(q.get("a") ?? -0.5); cam.position.set(Math.sin(a) * 3.2, 1.3, Math.cos(a) * 3.2); cam.lookAt(0, 0.52, 0); }

  const ui = document.getElementById('ui');
  for (const n of ms[0].names) {
    const b = document.createElement('button');
    b.textContent = n;
    b.onclick = () => { ms.forEach((m) => m.play(n)); [...ui.children].forEach((x) => x.classList.toggle('on', x === b)); };
    if (n === clip) b.classList.add('on');
    ui.appendChild(b);
  }

  const spin = q.has('spin');
  const clock = new THREE.Clock();
  // ?t=seconds advances the clip deterministically (for screenshots)
  if (q.has('t')) { const T = +q.get('t'); for (let x = 0; x < T; x += 1 / 60) ms.forEach((m) => m.update(1 / 60)); }
  renderer.setAnimationLoop(() => {
    const dt = clock.getDelta();
    if (!q.has('freeze')) ms.forEach((m) => m.update(dt));
    if (spin) ms[0].root.rotation.y += dt * 0.6;
    renderer.render(scene, cam);
  });
  addEventListener('resize', () => {
    cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
</script>
</body>
</html>
